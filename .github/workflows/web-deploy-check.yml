name: Web deploy check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web workspace only
        run: PRISMA_SKIP_POSTINSTALL_GENERATE=1 pnpm install --filter @mockup/web...

      - name: Build Next.js app
        run: pnpm --filter @mockup/web build
        env:
          OPENAI_API_KEY: dummy
          GHL_API_KEY: dummy
          GHL_LOCATION_ID: dummy

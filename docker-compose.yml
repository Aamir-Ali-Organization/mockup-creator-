services:
  postgres:
    image: postgres:16-alpine
    container_name: mockup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mockup_generator
    # Postgres is reachable on the Docker network as `postgres:5432`.
    # Uncomment to expose locally if needed: "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockup_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mockup-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mockup_generator?schema=public
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1024}
      AUTO_GENERATE_MOCKUP: ${AUTO_GENERATE_MOCKUP:-true}
      GHL_API_KEY: ${GHL_API_KEY}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID}
      GHL_API_BASE: ${GHL_API_BASE:-https://services.leadconnectorhq.com}
      GHL_FACEBOOK_LEAD_FIELD: ${GHL_FACEBOOK_LEAD_FIELD:-facebook_lead_id}
      GHL_MOCKUP_GENERATED_FIELD: ${GHL_MOCKUP_GENERATED_FIELD:-mockup_generated}
      GHL_MOCKUP_IMAGE_FIELD: ${GHL_MOCKUP_IMAGE_FIELD:-mockup_image}
      CORS_ORIGIN: http://localhost:8088,http://localhost:5173,http://frontend
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: mockup-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  postgres_data:
  uploads_data:
